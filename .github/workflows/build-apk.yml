name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Run engine tests
        run: ./gradlew :engine:test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build server distribution
        run: ./gradlew :server:installDist --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: puebloduerme-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload server distribution
        uses: actions/upload-artifact@v4
        with:
          name: puebloduerme-server
          path: server/build/install/server/

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: puebloduerme-debug

      - name: Download server
        uses: actions/download-artifact@v4
        with:
          name: puebloduerme-server
          path: server-dist

      - name: Package server
        run: |
          cd server-dist
          zip -r ../puebloduerme-server.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            app-debug.apk
            puebloduerme-server.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
